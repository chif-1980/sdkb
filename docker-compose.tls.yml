services:
  web:
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${YUXI_TLS_CERT_PATH:?Set YUXI_TLS_CERT_PATH to the TLS certificate chain}:/etc/nginx/tls/fullchain.pem:ro
      - ${YUXI_TLS_KEY_PATH:?Set YUXI_TLS_KEY_PATH to the TLS private key}:/etc/nginx/tls/privkey.pem:ro
