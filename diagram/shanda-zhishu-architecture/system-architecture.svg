<svg viewBox="0 0 1600 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">善达知枢系统架构</title>
  <desc id="desc">善达知枢从用户入口、应用、知识服务到数据与基础设施的分层架构</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb923c"/>
    </marker>
    <style>
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; letter-spacing: 0; }
      .region { fill: none; stroke-width: 1.2; stroke-dasharray: 8 5; }
      .region-label { font-size: 12px; font-weight: 700; }
      .box-title { fill: #f8fafc; font-size: 15px; font-weight: 700; text-anchor: middle; }
      .box-subtitle { fill: #94a3b8; font-size: 11px; font-weight: 400; text-anchor: middle; }
      .infra-title { fill: #f8fafc; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .connector { fill: none; stroke: #64748b; stroke-width: 2; }
      .connector-muted { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-opacity: 0.7; }
    </style>
  </defs>

  <rect width="1600" height="1080" fill="#0f172a"/>
  <rect width="1600" height="1080" fill="url(#grid)"/>

  <!-- Region boundaries -->
  <rect class="region" x="40" y="100" width="1520" height="150" rx="12" stroke="#94a3b8"/>
  <rect class="region" x="40" y="285" width="1520" height="165" rx="12" stroke="#22d3ee"/>
  <rect class="region" x="40" y="485" width="1520" height="250" rx="12" stroke="#34d399"/>
  <rect class="region" x="40" y="770" width="1520" height="145" rx="12" stroke="#a78bfa"/>
  <rect class="region" x="40" y="950" width="1520" height="95" rx="12" stroke="#fbbf24"/>

  <!-- Connection layer -->
  <path class="connector-muted" d="M 220 215 V 265 M 600 215 V 265 M 980 215 V 265 M 220 265 H 980"/>
  <path class="connector" d="M 480 265 V 330" marker-end="url(#arrow-cyan)"/>
  <path class="connector" d="M 1360 215 V 265 H 1170 V 330" marker-end="url(#arrow-cyan)"/>

  <path d="M 480 410 V 468 M 1170 410 V 468 M 200 468 H 1400" fill="none" stroke="#fb923c" stroke-width="3" stroke-opacity="0.85"/>
  <path class="connector" d="M 200 468 V 550" marker-end="url(#arrow)"/>
  <path class="connector" d="M 500 468 V 550" marker-end="url(#arrow)"/>
  <path class="connector" d="M 800 468 V 550" marker-end="url(#arrow)"/>
  <path class="connector" d="M 1100 468 V 550" marker-end="url(#arrow)"/>
  <path class="connector" d="M 1400 468 V 550" marker-end="url(#arrow)"/>

  <path class="connector-muted" d="M 200 650 V 750 M 500 650 V 750 M 800 650 V 750 M 1100 650 V 750 M 1400 650 V 750"/>
  <path d="M 200 750 H 1400" fill="none" stroke="#fb923c" stroke-width="3" stroke-opacity="0.85"/>
  <path class="connector" d="M 230 750 V 810" marker-end="url(#arrow-orange)"/>
  <path class="connector" d="M 600 750 V 810" marker-end="url(#arrow-orange)"/>
  <path class="connector" d="M 970 750 V 810" marker-end="url(#arrow-orange)"/>
  <path class="connector" d="M 1340 750 V 810" marker-end="url(#arrow-orange)"/>

  <!-- Opaque masks -->
  <g fill="#0f172a">
    <rect x="90" y="145" width="260" height="70" rx="7"/>
    <rect x="470" y="145" width="260" height="70" rx="7"/>
    <rect x="850" y="145" width="260" height="70" rx="7"/>
    <rect x="1230" y="145" width="260" height="70" rx="7"/>
    <rect x="160" y="330" width="640" height="80" rx="8"/>
    <rect x="850" y="330" width="590" height="80" rx="8"/>
    <rect x="70" y="550" width="260" height="100" rx="8"/>
    <rect x="370" y="550" width="260" height="100" rx="8"/>
    <rect x="670" y="550" width="260" height="100" rx="8"/>
    <rect x="970" y="550" width="260" height="100" rx="8"/>
    <rect x="1270" y="550" width="260" height="100" rx="8"/>
    <rect x="80" y="810" width="300" height="70" rx="7"/>
    <rect x="450" y="810" width="300" height="70" rx="7"/>
    <rect x="820" y="810" width="300" height="70" rx="7"/>
    <rect x="1190" y="810" width="300" height="70" rx="7"/>
    <rect x="100" y="985" width="300" height="45" rx="6"/>
    <rect x="470" y="985" width="300" height="45" rx="6"/>
    <rect x="840" y="985" width="300" height="45" rx="6"/>
    <rect x="1210" y="985" width="300" height="45" rx="6"/>
  </g>

  <!-- Component boxes -->
  <g fill="#1e293b" fill-opacity="0.88" stroke="#94a3b8" stroke-width="1.5">
    <rect x="90" y="145" width="260" height="70" rx="7"/>
    <rect x="470" y="145" width="260" height="70" rx="7"/>
    <rect x="850" y="145" width="260" height="70" rx="7"/>
    <rect x="1230" y="145" width="260" height="70" rx="7"/>
  </g>
  <g fill="#083344" fill-opacity="0.78" stroke="#22d3ee" stroke-width="1.8">
    <rect x="160" y="330" width="640" height="80" rx="8"/>
    <rect x="850" y="330" width="590" height="80" rx="8"/>
  </g>
  <g fill="#064e3b" fill-opacity="0.72" stroke="#34d399" stroke-width="1.7">
    <rect x="70" y="550" width="260" height="100" rx="8"/>
    <rect x="370" y="550" width="260" height="100" rx="8"/>
    <rect x="670" y="550" width="260" height="100" rx="8"/>
    <rect x="970" y="550" width="260" height="100" rx="8"/>
    <rect x="1270" y="550" width="260" height="100" rx="8"/>
  </g>
  <g fill="#4c1d95" fill-opacity="0.65" stroke="#a78bfa" stroke-width="1.7">
    <rect x="80" y="810" width="300" height="70" rx="7"/>
    <rect x="450" y="810" width="300" height="70" rx="7"/>
    <rect x="820" y="810" width="300" height="70" rx="7"/>
    <rect x="1190" y="810" width="300" height="70" rx="7"/>
  </g>
  <g fill="#78350f" fill-opacity="0.55" stroke="#fbbf24" stroke-width="1.5">
    <rect x="100" y="985" width="300" height="45" rx="6"/>
    <rect x="470" y="985" width="300" height="45" rx="6"/>
    <rect x="840" y="985" width="300" height="45" rx="6"/>
    <rect x="1210" y="985" width="300" height="45" rx="6"/>
  </g>

  <!-- Labels -->
  <g>
    <text class="box-title" x="220" y="174">飞书知识源</text>
    <text class="box-subtitle" x="220" y="196">Wiki · 文档 · 附件</text>
    <text class="box-title" x="600" y="174">知识管理员</text>
    <text class="box-subtitle" x="600" y="196">接入 · 加工 · 发布</text>
    <text class="box-title" x="980" y="174">审核人员</text>
    <text class="box-subtitle" x="980" y="196">核对 · 批复 · 退回</text>
    <text class="box-title" x="1360" y="174">企业员工</text>
    <text class="box-subtitle" x="1360" y="196">提问 · 查证 · 使用</text>

    <text class="box-title" x="480" y="365">知识管理与审核平台</text>
    <text class="box-subtitle" x="480" y="390">资料接入 · 版式核对 · 单元审核 · 正式发布</text>
    <text class="box-title" x="1145" y="365">企业知识助手</text>
    <text class="box-subtitle" x="1145" y="390">可信问答 · 引用证据 · 简洁 / 详细模式</text>

    <text class="box-title" x="200" y="587">飞书资料接入</text>
    <text class="box-subtitle" x="200" y="612">OAuth · Wiki 同步</text>
    <text class="box-subtitle" x="200" y="630">增量 / 全量扫描</text>
    <text class="box-title" x="500" y="587">版式解析还原</text>
    <text class="box-subtitle" x="500" y="612">Word · Excel · PDF</text>
    <text class="box-subtitle" x="500" y="630">PPT · 图片</text>
    <text class="box-title" x="800" y="587">知识单元治理</text>
    <text class="box-subtitle" x="800" y="612">原始材料 → 知识单元</text>
    <text class="box-subtitle" x="800" y="630">→ 知识片段</text>
    <text class="box-title" x="1100" y="587">审核与发布</text>
    <text class="box-subtitle" x="1100" y="612">单元审核 · 整篇审核</text>
    <text class="box-subtitle" x="1100" y="630">版本与处理记录</text>
    <text class="box-title" x="1400" y="587">可信问答</text>
    <text class="box-subtitle" x="1400" y="612">检索 · 证据 · 引用</text>
    <text class="box-subtitle" x="1400" y="630">身份与部门权限</text>

    <text class="box-title" x="230" y="840">PostgreSQL</text>
    <text class="box-subtitle" x="230" y="861">业务数据 · 审核记录</text>
    <text class="box-title" x="600" y="840">Redis</text>
    <text class="box-subtitle" x="600" y="861">缓存 · 任务队列</text>
    <text class="box-title" x="970" y="840">MinIO</text>
    <text class="box-subtitle" x="970" y="861">原始文件 · 版式资源</text>
    <text class="box-title" x="1340" y="840">Milvus</text>
    <text class="box-subtitle" x="1340" y="861">向量索引 · 语义检索</text>

    <text class="infra-title" x="250" y="1013">FastAPI · 业务接口</text>
    <text class="infra-title" x="620" y="1013">ARQ Worker · 异步任务</text>
    <text class="infra-title" x="990" y="1013">Sandbox · 文档处理</text>
    <text class="infra-title" x="1360" y="1013">Docker Compose · 部署</text>
  </g>

  <!-- Region labels and title block -->
  <text class="region-label" x="58" y="123" fill="#94a3b8">用户与资料来源</text>
  <text class="region-label" x="58" y="308" fill="#22d3ee">产品应用</text>
  <text class="region-label" x="58" y="508" fill="#34d399">知识服务</text>
  <text class="region-label" x="58" y="793" fill="#a78bfa">数据与检索</text>
  <text class="region-label" x="58" y="973" fill="#fbbf24">运行基础设施</text>
  <text x="40" y="48" fill="#f8fafc" font-size="24" font-weight="700">善达知枢 · 系统架构</text>
  <text x="40" y="74" fill="#94a3b8" font-size="12">企业知识从资料接入、知识治理到可信问答的完整链路</text>
</svg>
