<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" role="img" aria-labelledby="title desc"><title id="title">企业知识助手 · 功能架构</title><desc id="desc">员工从问题出发，获得有来源的回答，并把问题反馈给知识管理员</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7" fill="#94a3b8"/></marker></defs><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}.head{fill:#f8fafc;font-size:28px;font-weight:600}.label{fill:#f8fafc;font-size:21px;font-weight:600}.sub{fill:#cbd5e1;font-size:16px}</style><rect width="1000" height="790" rx="16" fill="#0f172a"/><rect width="1000" height="790" fill="url(#grid)"/><text x="40" y="54" class="head">企业知识助手 · 功能架构</text><text x="40" y="87" class="sub">员工从问题出发，获得有来源的回答，并把问题反馈给知识管理员</text><rect x="30" y="125" width="940" height="115" rx="12" stroke="#22d3ee" fill="none" stroke-dasharray="6 4"/><text x="48" y="152" fill="#22d3ee" font-size="17">01 员工入口</text><path d="M500 240V266" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="220" y="144" width="220" height="77" rx="9" fill="#0f172a"/><rect x="220" y="144" width="220" height="77" rx="9" fill="#22d3ee" fill-opacity=".09" stroke="#22d3ee"/><text x="330" y="175" text-anchor="middle" class="label">账号登录</text><text x="330" y="202" text-anchor="middle" class="sub">组织身份 · 访问权限</text><rect x="465" y="144" width="220" height="77" rx="9" fill="#0f172a"/><rect x="465" y="144" width="220" height="77" rx="9" fill="#22d3ee" fill-opacity=".09" stroke="#22d3ee"/><text x="575" y="175" text-anchor="middle" class="label">会话管理</text><text x="575" y="202" text-anchor="middle" class="sub">新建 · 历史 · 归档</text><rect x="710" y="144" width="220" height="77" rx="9" fill="#0f172a"/><rect x="710" y="144" width="220" height="77" rx="9" fill="#22d3ee" fill-opacity=".09" stroke="#22d3ee"/><text x="820" y="175" text-anchor="middle" class="label">提出问题</text><text x="820" y="202" text-anchor="middle" class="sub">具体场景 · 继续追问</text><rect x="30" y="270" width="940" height="115" rx="12" stroke="#34d399" fill="none" stroke-dasharray="6 4"/><text x="48" y="297" fill="#34d399" font-size="17">02 问答输入</text><path d="M500 385V411" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="220" y="289" width="220" height="77" rx="9" fill="#0f172a"/><rect x="220" y="289" width="220" height="77" rx="9" fill="#34d399" fill-opacity=".09" stroke="#34d399"/><text x="330" y="320" text-anchor="middle" class="label">回答模式</text><text x="330" y="347" text-anchor="middle" class="sub">简洁 / 详细</text><rect x="465" y="289" width="220" height="77" rx="9" fill="#0f172a"/><rect x="465" y="289" width="220" height="77" rx="9" fill="#34d399" fill-opacity=".09" stroke="#34d399"/><text x="575" y="320" text-anchor="middle" class="label">会话附件</text><text x="575" y="347" text-anchor="middle" class="sub">文档 · 表格 · 图片</text><rect x="710" y="289" width="220" height="77" rx="9" fill="#0f172a"/><rect x="710" y="289" width="220" height="77" rx="9" fill="#34d399" fill-opacity=".09" stroke="#34d399"/><text x="820" y="320" text-anchor="middle" class="label">企业知识范围</text><text x="820" y="347" text-anchor="middle" class="sub">已发布 · 有效 · 有权限</text><rect x="30" y="415" width="940" height="115" rx="12" stroke="#a78bfa" fill="none" stroke-dasharray="6 4"/><text x="48" y="442" fill="#a78bfa" font-size="17">03 回答与核验</text><path d="M500 530V556" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="220" y="434" width="220" height="77" rx="9" fill="#0f172a"/><rect x="220" y="434" width="220" height="77" rx="9" fill="#a78bfa" fill-opacity=".09" stroke="#a78bfa"/><text x="330" y="465" text-anchor="middle" class="label">资料检索</text><text x="330" y="492" text-anchor="middle" class="sub">查找可用正式证据</text><rect x="465" y="434" width="220" height="77" rx="9" fill="#0f172a"/><rect x="465" y="434" width="220" height="77" rx="9" fill="#a78bfa" fill-opacity=".09" stroke="#a78bfa"/><text x="575" y="465" text-anchor="middle" class="label">生成回答</text><text x="575" y="492" text-anchor="middle" class="sub">结论 · 条件 · 引用编号</text><rect x="710" y="434" width="220" height="77" rx="9" fill="#0f172a"/><rect x="710" y="434" width="220" height="77" rx="9" fill="#a78bfa" fill-opacity=".09" stroke="#a78bfa"/><text x="820" y="465" text-anchor="middle" class="label">查看来源</text><text x="820" y="492" text-anchor="middle" class="sub">路径 · 定位 · 原文</text><rect x="30" y="560" width="940" height="115" rx="12" stroke="#fbbf24" fill="none" stroke-dasharray="6 4"/><text x="48" y="587" fill="#fbbf24" font-size="17">04 反馈与维护</text><rect x="220" y="579" width="220" height="77" rx="9" fill="#0f172a"/><rect x="220" y="579" width="220" height="77" rx="9" fill="#fbbf24" fill-opacity=".09" stroke="#fbbf24"/><text x="330" y="610" text-anchor="middle" class="label">评价回答</text><text x="330" y="637" text-anchor="middle" class="sub">点赞 / 点踩 · 原因</text><rect x="465" y="579" width="220" height="77" rx="9" fill="#0f172a"/><rect x="465" y="579" width="220" height="77" rx="9" fill="#fbbf24" fill-opacity=".09" stroke="#fbbf24"/><text x="575" y="610" text-anchor="middle" class="label">治理待办</text><text x="575" y="637" text-anchor="middle" class="sub">可定位反馈交给管理员</text><rect x="710" y="579" width="220" height="77" rx="9" fill="#0f172a"/><rect x="710" y="579" width="220" height="77" rx="9" fill="#fbbf24" fill-opacity=".09" stroke="#fbbf24"/><text x="820" y="610" text-anchor="middle" class="label">知识更新</text><text x="820" y="637" text-anchor="middle" class="sub">复核修订 → 发布验证</text><text x="40" y="744" class="sub">使用边界：会话附件不会自动入库；详细模式不扩大权限；依据不足或冲突应明确提示。</text></svg>