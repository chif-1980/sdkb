<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">企业知识助手 0.6.10 对话界面示意</title>
  <desc id="desc">脱敏界面示意：对话列表、归档入口、技能选择和快速回答输入区。</desc>
  <style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}.muted{fill:#64748b;font-size:14px}.label{fill:#0f172a;font-size:18px;font-weight:600}.blue{fill:#2463a0;font-size:15px;font-weight:600}</style>
  <rect width="1440" height="900" fill="#fff"/><rect width="220" height="900" fill="#f5f8fc"/><text x="20" y="36" class="label">企业知识助手</text><text x="20" y="84" class="label" style="font-size:15px">对话</text><rect x="12" y="106" width="196" height="42" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="72" y="133" class="blue">＋ 新对话</text><text x="22" y="178" class="muted">已归档　　　　　　　　　7</text><rect x="12" y="198" width="196" height="38" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="30" y="223" class="muted">⌕ 搜索会话</text><rect x="12" y="250" width="196" height="52" rx="7" fill="#e8f2fc"/><text x="28" y="281" class="label" style="font-size:15px">投标一体机销售话术有哪些</text><text x="22" y="350" class="muted">暂无进行中会话</text>
  <text x="510" y="168" class="blue">统一对话入口 · 企业知识助手</text><text x="510" y="224" class="label" style="font-size:38px">让每一次工作协作，<tspan fill="#2f6fd8">都从一个对话开始。</tspan></text><rect x="510" y="280" width="650" height="74" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="542" y="312" class="blue">默认能力 · 直接问答</text><text x="542" y="337" class="muted">基于已审核、已发布且有权限访问的企业资料，回答并保留引用。</text><text x="510" y="414" class="muted">可调用技能</text><rect x="620" y="388" width="110" height="36" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="640" y="412" class="blue">@查资料</text><rect x="744" y="388" width="140" height="36" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="764" y="412" class="blue">@做方案 / 汇报</text><rect x="898" y="388" width="130" height="36" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="918" y="412" class="blue">@会议纪要</text><text x="510" y="466" class="muted">输入 @ 可明确指定技能；附件仅作为当前会话上下文，不会自动发布到知识库。</text><rect x="420" y="720" width="820" height="104" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="446" y="758" class="muted">输入你的问题</text><rect x="446" y="778" width="32" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="455" y="799" class="blue">⌕</text><rect x="1182" y="768" width="44" height="44" rx="8" fill="#7da4e8"/><text x="1194" y="798" fill="#fff" font-size="20">➤</text><text x="510" y="866" class="muted">版本：企业知识助手 0.6.10 · 界面依据线上 2026-09-24 核对</text>
</svg>
