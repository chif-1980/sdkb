<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">善达知枢右侧嵌入企业知识助手界面示意</title>
  <desc id="desc">脱敏界面示意：管理端左侧菜单保持可见，企业知识助手在右侧内容区打开。</desc>
  <style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}.muted{fill:#64748b;font-size:14px}.label{fill:#0f172a;font-size:18px;font-weight:600}.small{fill:#64748b;font-size:13px}.blue{fill:#2463a0;font-size:15px;font-weight:600}</style>
  <rect width="1440" height="900" fill="#f8fafc"/><rect x="0" width="230" height="900" fill="#fff" stroke="#e2e8f0"/><text x="28" y="38" class="label">善达知枢</text><text x="28" y="88" class="muted">创建新对话</text><text x="28" y="126" class="muted">搜索对话</text><rect x="10" y="144" width="210" height="42" rx="8" fill="#e6f6f5"/><text x="28" y="171" fill="#0f766e" font-size="15" font-weight="600">企业知识助手</text><text x="28" y="216" class="muted">工作区</text><text x="28" y="254" class="muted">智能体扩展</text><text x="28" y="292" class="muted">智能体管理</text><text x="28" y="330" class="muted">知识加工</text><text x="28" y="368" class="muted">会议管理</text><text x="28" y="406" class="muted">用户反馈</text><text x="28" y="444" class="muted">数据总览</text>
  <rect x="230" width="1210" height="900" fill="#fff"/><rect x="230" y="0" width="1210" height="56" fill="#fff" stroke="#e2e8f0"/><text x="258" y="36" class="label">企业知识助手</text><text x="1240" y="35" class="muted">程峰</text><rect x="1350" y="13" width="58" height="30" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="1364" y="34" class="small">退出</text>
  <rect x="250" y="78" width="200" height="760" fill="#f8fafc" stroke="#e2e8f0"/><text x="272" y="112" class="label">对话</text><rect x="268" y="132" width="166" height="42" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="315" y="159" class="blue">＋ 新对话</text><rect x="268" y="188" width="166" height="38" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="286" y="213" class="small">搜索会话</text><rect x="268" y="244" width="166" height="56" rx="7" fill="#e8f2fc"/><text x="286" y="277" class="label" style="font-size:15px">投标一体机销售话术...</text><text x="272" y="352" class="muted">已归档 · 7 个会话</text><rect x="268" y="382" width="166" height="44" rx="7" fill="#fff" stroke="#e2e8f0"/><text x="286" y="409" class="small">后台任务 2</text>
  <text x="486" y="118" class="label">投标一体机销售话术有哪些</text><rect x="486" y="146" width="870" height="92" rx="10" fill="#edf4fb"/><text x="510" y="180" class="blue">助手 · 有正式资料支持</text><text x="510" y="210" class="label" style="font-size:16px">基于已审核、已发布且你有权限访问的正式知识生成回答。</text>
  <text x="486" y="286" class="label">回答摘要</text><text x="486" y="322" class="muted">展示结论、适用条件和可打开的引用；点击引用可核对原文位置。</text><rect x="486" y="350" width="110" height="36" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="514" y="374" class="blue">[1] 引用</text><rect x="610" y="350" width="110" height="36" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="638" y="374" class="blue">[2] 引用</text><line x1="486" y1="430" x2="1356" y2="430" stroke="#e2e8f0"/><text x="486" y="468" class="small">当前会话可继续追问，也可在输入框使用 @会议纪要、@查资料或 @做方案。</text><rect x="486" y="720" width="870" height="96" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="510" y="756" class="muted">输入你的问题</text><rect x="510" y="774" width="92" height="28" rx="6" fill="#e8f2fc"/><text x="526" y="793" class="blue">快速回答⌄</text><rect x="1278" y="754" width="52" height="46" rx="8" fill="#7da4e8"/><text x="1294" y="783" fill="#fff" font-size="20">➤</text>
  <text x="486" y="866" class="small">右侧内容区嵌入助手，左侧管理菜单保持可用；登录通过一次性 60 秒交接码完成。</text>
</svg>
