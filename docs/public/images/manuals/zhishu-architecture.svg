<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" role="img" aria-labelledby="title desc"><title id="title">善达知枢 · 功能架构</title><desc id="desc">把来源资料转化为可追溯、可审核、可维护的正式知识</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7" fill="#94a3b8"/></marker></defs><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}.head{fill:#f8fafc;font-size:28px;font-weight:600}.label{fill:#f8fafc;font-size:21px;font-weight:600}.sub{fill:#cbd5e1;font-size:16px}</style><rect width="1000" height="790" rx="16" fill="#0f172a"/><rect width="1000" height="790" fill="url(#grid)"/><text x="40" y="54" class="head">善达知枢 · 功能架构</text><text x="40" y="87" class="sub">把来源资料转化为可追溯、可审核、可维护的正式知识</text><rect x="30" y="125" width="940" height="115" rx="12" stroke="#22d3ee" fill="none" stroke-dasharray="6 4"/><text x="48" y="152" fill="#22d3ee" font-size="17">01 资料接入</text><path d="M500 240V266" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="220" y="144" width="220" height="77" rx="9" fill="#0f172a"/><rect x="220" y="144" width="220" height="77" rx="9" fill="#22d3ee" fill-opacity=".09" stroke="#22d3ee"/><text x="330" y="175" text-anchor="middle" class="label">飞书知识库</text><text x="330" y="202" text-anchor="middle" class="sub">链接 · 范围 · 授权</text><rect x="465" y="144" width="220" height="77" rx="9" fill="#0f172a"/><rect x="465" y="144" width="220" height="77" rx="9" fill="#22d3ee" fill-opacity=".09" stroke="#22d3ee"/><text x="575" y="175" text-anchor="middle" class="label">连接与扫描</text><text x="575" y="202" text-anchor="middle" class="sub">检查连接 · 全量 / 增量</text><rect x="710" y="144" width="220" height="77" rx="9" fill="#0f172a"/><rect x="710" y="144" width="220" height="77" rx="9" fill="#22d3ee" fill-opacity=".09" stroke="#22d3ee"/><text x="820" y="175" text-anchor="middle" class="label">来源素材</text><text x="820" y="202" text-anchor="middle" class="sub">目录 · 版本 · 来源状态</text><rect x="30" y="270" width="940" height="115" rx="12" stroke="#34d399" fill="none" stroke-dasharray="6 4"/><text x="48" y="297" fill="#34d399" font-size="17">02 自动加工</text><path d="M500 385V411" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="220" y="289" width="220" height="77" rx="9" fill="#0f172a"/><rect x="220" y="289" width="220" height="77" rx="9" fill="#34d399" fill-opacity=".09" stroke="#34d399"/><text x="330" y="320" text-anchor="middle" class="label">内容解析</text><text x="330" y="347" text-anchor="middle" class="sub">正文 · 图片 · 版式</text><rect x="465" y="289" width="220" height="77" rx="9" fill="#0f172a"/><rect x="465" y="289" width="220" height="77" rx="9" fill="#34d399" fill-opacity=".09" stroke="#34d399"/><text x="575" y="320" text-anchor="middle" class="label">知识单元</text><text x="575" y="347" text-anchor="middle" class="sub">装饰过滤 · 内容归并</text><rect x="710" y="289" width="220" height="77" rx="9" fill="#0f172a"/><rect x="710" y="289" width="220" height="77" rx="9" fill="#34d399" fill-opacity=".09" stroke="#34d399"/><text x="820" y="320" text-anchor="middle" class="label">自动检查</text><text x="820" y="347" text-anchor="middle" class="sub">重复 · 重叠 · 冲突</text><rect x="30" y="415" width="940" height="115" rx="12" stroke="#a78bfa" fill="none" stroke-dasharray="6 4"/><text x="48" y="442" fill="#a78bfa" font-size="17">03 审核治理</text><path d="M500 530V556" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="220" y="434" width="220" height="77" rx="9" fill="#0f172a"/><rect x="220" y="434" width="220" height="77" rx="9" fill="#a78bfa" fill-opacity=".09" stroke="#a78bfa"/><text x="330" y="465" text-anchor="middle" class="label">审核任务</text><text x="330" y="492" text-anchor="middle" class="sub">原文定位 · AI 建议</text><rect x="465" y="434" width="220" height="77" rx="9" fill="#0f172a"/><rect x="465" y="434" width="220" height="77" rx="9" fill="#a78bfa" fill-opacity=".09" stroke="#a78bfa"/><text x="575" y="465" text-anchor="middle" class="label">跨文档证据</text><text x="575" y="492" text-anchor="middle" class="sub">核对两侧 · 作出决定</text><rect x="710" y="434" width="220" height="77" rx="9" fill="#0f172a"/><rect x="710" y="434" width="220" height="77" rx="9" fill="#a78bfa" fill-opacity=".09" stroke="#a78bfa"/><text x="820" y="465" text-anchor="middle" class="label">运营待办</text><text x="820" y="492" text-anchor="middle" class="sub">失败 · 到期 · 来源更新</text><rect x="30" y="560" width="940" height="115" rx="12" stroke="#fbbf24" fill="none" stroke-dasharray="6 4"/><text x="48" y="587" fill="#fbbf24" font-size="17">04 发布与使用</text><rect x="220" y="579" width="220" height="77" rx="9" fill="#0f172a"/><rect x="220" y="579" width="220" height="77" rx="9" fill="#fbbf24" fill-opacity=".09" stroke="#fbbf24"/><text x="330" y="610" text-anchor="middle" class="label">正式知识</text><text x="330" y="637" text-anchor="middle" class="sub">审核发布 · 版本记录</text><rect x="465" y="579" width="220" height="77" rx="9" fill="#0f172a"/><rect x="465" y="579" width="220" height="77" rx="9" fill="#fbbf24" fill-opacity=".09" stroke="#fbbf24"/><text x="575" y="610" text-anchor="middle" class="label">企业知识助手</text><text x="575" y="637" text-anchor="middle" class="sub">按权限检索 · 引用</text><rect x="710" y="579" width="220" height="77" rx="9" fill="#0f172a"/><rect x="710" y="579" width="220" height="77" rx="9" fill="#fbbf24" fill-opacity=".09" stroke="#fbbf24"/><text x="820" y="610" text-anchor="middle" class="label">反馈复核</text><text x="820" y="637" text-anchor="middle" class="sub">员工反馈 → 运营待办</text><text x="40" y="744" class="sub">贯穿全流程：账号权限 · 来源追溯 · 操作记录。扫描完成 ≠ 审核通过 ≠ 发布成功。</text></svg>