<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">善达知枢 0.7.0 角色权限工作区界面示意</title>
  <desc id="desc">脱敏界面示意：左侧角色列表，右侧按主菜单配置菜单与操作，并提供数据范围、授权成员和生效预览。</desc>
  <style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}.muted{fill:#64748b;font-size:15px}.label{fill:#0f172a;font-size:18px;font-weight:600}.small{fill:#64748b;font-size:13px}.tab{fill:#0f766e;font-size:15px;font-weight:600}.title{fill:#0f172a;font-size:30px;font-weight:700}</style>
  <rect width="1440" height="900" fill="#f8fafc"/><rect x="0" width="230" height="900" fill="#fff" stroke="#e2e8f0"/>
  <text x="28" y="38" class="label">善达知枢</text><text x="28" y="92" class="muted">创建新对话</text><text x="28" y="134" class="muted">搜索对话</text><text x="28" y="176" class="muted">企业知识助手</text><text x="28" y="218" class="muted">工作区</text><text x="28" y="260" class="muted">智能体扩展</text><text x="28" y="302" class="muted">智能体管理</text><text x="28" y="344" class="muted">知识加工</text><text x="28" y="386" class="muted">会议管理</text><rect x="10" y="400" width="210" height="42" rx="8" fill="#e6f6f5"/><text x="28" y="427" fill="#0f766e" font-size="15" font-weight="600">设置 / 角色权限</text>
  <text x="262" y="48" class="muted">设置 / 角色权限</text><text x="262" y="92" class="title">角色权限</text><text x="262" y="122" class="muted">先选择角色，再配置菜单、页面内能力和成员来源。生效预览显示用户最终获得的权限。</text>
  <rect x="1150" y="54" width="104" height="40" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="1174" y="80" class="muted">刷新</text><rect x="1264" y="54" width="150" height="40" rx="8" fill="#0f8f8a"/><text x="1290" y="80" fill="#fff" font-size="15">创建角色</text>
  <rect x="262" y="152" width="300" height="680" rx="12" fill="#fff" stroke="#e2e8f0"/><text x="284" y="190" class="label">角色</text><text x="430" y="190" class="small">3 个角色</text><rect x="284" y="208" width="256" height="40" rx="7" fill="#f8fafc" stroke="#e2e8f0"/><text x="304" y="233" class="small">搜索角色</text>
  <g><rect x="284" y="266" width="256" height="98" rx="9" fill="#f8fafc"/><text x="304" y="293" class="label">普通用户</text><text x="304" y="318" class="small">内置 · 兼容现有普通用户账号</text><text x="304" y="342" class="small">8 位用户 · 0 个部门 · 0 个入口</text></g>
  <g><rect x="284" y="378" width="256" height="98" rx="9" fill="#f8fafc"/><text x="304" y="405" class="label">管理员</text><text x="304" y="430" class="small">内置 · 兼容现有管理员账号</text><text x="304" y="454" class="small">3 位用户 · 0 个部门 · 5 个入口</text></g>
  <g><rect x="284" y="490" width="256" height="112" rx="9" fill="#e6f6f5" stroke="#0f8f8a"/><text x="304" y="518" class="label">超级管理员</text><text x="304" y="543" class="small">内置 · 系统全量权限</text><text x="304" y="568" class="small">1 位用户 · 0 个部门 · 7 个入口</text></g>
  <text x="284" y="650" class="small">左侧主导航展示当前管理员能访问的入口。</text><text x="284" y="674" class="small">这里配置所选角色，实际菜单查看“生效预览”。</text>
  <rect x="586" y="152" width="828" height="680" rx="12" fill="#fff" stroke="#e2e8f0"/><text x="614" y="190" class="small">当前角色</text><text x="614" y="230" class="title" style="font-size:26px">超级管理员</text><text x="810" y="230" class="small">内置角色 · 系统全量权限</text><text x="1270" y="190" class="small">1 位用户 · 0 个部门</text>
  <line x1="614" y1="260" x2="1386" y2="260" stroke="#e2e8f0"/><text x="624" y="296" class="tab">▣ 菜单与操作</text><text x="790" y="296" class="muted">◉ 数据范围</text><text x="930" y="296" class="muted">♧ 授权成员</text><text x="1080" y="296" class="muted">✓ 生效预览</text><line x1="614" y1="314" x2="770" y2="314" stroke="#0f8f8a" stroke-width="3"/>
  <text x="614" y="356" class="label">与主菜单一一对应</text><text x="614" y="384" class="small">菜单名称和顺序与左侧主菜单保持一致；展开后配置页面内能力。</text><text x="1110" y="384" class="small">不可访问 · 仅查看 · 可管理</text>
  <rect x="614" y="412" width="772" height="42" rx="7" fill="#f1f5f9"/><text x="638" y="439" class="label">⌄ 主菜单</text><text x="1320" y="439" class="small">7 项</text>
  <g><text x="650" y="493" class="label">工作区</text><text x="650" y="518" class="small">工作区文件与目录</text><rect x="1160" y="468" width="200" height="42" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="1200" y="494" class="small">可管理⌄</text></g>
  <g><text x="650" y="563" class="label">智能体扩展</text><text x="650" y="588" class="small">知识库、工具与技能</text><rect x="1160" y="538" width="200" height="42" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="1200" y="564" class="small">可管理⌄</text></g>
  <g><text x="650" y="633" class="label">知识加工</text><text x="650" y="658" class="small">知识来源与扫描</text><rect x="1160" y="608" width="200" height="42" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="1200" y="634" class="small">可管理⌄</text></g>
  <g><text x="650" y="703" class="label">会议管理</text><text x="650" y="728" class="small">会议、纪要与待办</text><rect x="1160" y="678" width="200" height="42" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="1200" y="704" class="small">可管理⌄</text></g>
  <rect x="614" y="752" width="772" height="48" rx="7" fill="#f8fafc"/><text x="638" y="782" class="small">其他入口与系统设置 · 创建新对话、搜索对话和个人账户设置是固定入口。</text>
</svg>
